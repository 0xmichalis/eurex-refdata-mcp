name: Release

# Publish a GitHub Release with prebuilt, fully-static (musl) Linux binaries when a
# version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# musl binaries are statically linked (no libc dependency), so they run on any
# x86_64 Linux regardless of the host's glibc version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

# Least privilege: only the job that publishes needs write. The build job runs
# dependency build scripts, so it gets a read-only token and, below, a checkout
# that does not leave it in .git/config.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Resolved once. On workflow_dispatch github.ref_name is the branch the
  # workflow was dispatched from ("main"), not the tag being released.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          # aarch64-unknown-linux-musl can be added here later (cross handles it).

    steps:
    # A tag name may legally contain shell metacharacters, and it reaches the
    # `run:` scripts below. Reject anything that is not a plain version tag before
    # it is used, and pass it through env rather than `${{ }}` interpolation.
    - name: Validate release tag
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
          echo "refusing to release a tag that is not vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
          exit 1
        fi

    # On a tag push this is the tag; on workflow_dispatch it must be stated
    # explicitly, or checkout would silently build the default branch and
    # publish it under the tag's name.
    #
    # persist-credentials: false keeps the token out of .git/config — cargo runs
    # dependency build scripts, which would otherwise be able to read it.
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_TAG }}
        persist-credentials: false

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    # `cross` builds the musl target inside a container with the full toolchain
    # (C compiler + cmake) that aws-lc-rs / reqwest's TLS stack needs.
    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Build static binary
      run: cross build --release --locked --target ${{ matrix.target }}

    - name: Package binary and checksum
      uses: 0xmichalis/repo-tooling/actions/package-rust-binary@ed1b0c7db2764f49a7144c7eff80351a90b65ded # v1.0.0
      with:
        binary: eurex-refdata-mcp
        tag: ${{ env.RELEASE_TAG }}
        target: ${{ matrix.target }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}
        path: |
          eurex-refdata-mcp-*.tar.gz
          eurex-refdata-mcp-*.tar.gz.sha256
        if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        draft: false
        generate_release_notes: true
        files: |
          artifacts/eurex-refdata-mcp-*.tar.gz
          artifacts/eurex-refdata-mcp-*.tar.gz.sha256
