[package]
name = "eurex-refdata-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only Eurex Reference Data MCP server (options chains, products, expirations)"
authors = ["Michalis Kargakis <kargakis@protonmail.com>"]
readme = "README.md"
keywords = ["mcp", "eurex", "deutsche-boerse", "options", "finance"]
categories = ["api-bindings"]

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset"] }
rmcp = { version = "1.7.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
wiremock = "0.6.5"

[profile.release]
strip = true
lto = true
